<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 51st Birthday Dad!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 800px;
            perspective: 1500px;
        }

        .card {
            position: relative;
            width: 100%;
            height: 600px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .card-front {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 3px solid gold;
        }

        .card-back {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            transform: rotateY(180deg);
            border: 3px solid gold;
        }

        h1 {
            font-size: 3.5em;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.5); }
            50% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 255, 255, 0.8); }
        }

        .number {
            font-size: 8em;
            font-weight: bold;
            color: gold;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);
            margin: 20px 0;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .poem {
            font-size: 1.4em;
            color: white;
            text-align: center;
            line-height: 1.8;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .poem-line {
            margin: 10px 0;
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
        }

        .poem-line:nth-child(1) { animation-delay: 0.2s; }
        .poem-line:nth-child(2) { animation-delay: 0.4s; }
        .poem-line:nth-child(3) { animation-delay: 0.6s; }
        .poem-line:nth-child(4) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 1.1em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: gold;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .balloon1 { background: #ff6b6b; top: 10%; left: 5%; animation-delay: 0s; }
        .balloon2 { background: #4ecdc4; top: 20%; right: 5%; animation-delay: 0.5s; }
        .balloon3 { background: #ffe66d; bottom: 15%; left: 10%; animation-delay: 1s; }
        .balloon4 { background: #a8e6cf; bottom: 25%; right: 10%; animation-delay: 1.5s; }

        .message {
            font-size: 1.3em;
            color: white;
            text-align: center;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="balloon balloon1"></div>
        <div class="balloon balloon2"></div>
        <div class="balloon balloon3"></div>
        <div class="balloon balloon4"></div>
        
        <div class="card" onclick="this.classList.toggle('flipped')">
            <div class="card-face card-front">
                <h1>Happy Birthday!</h1>
                <div class="number">51</div>
                <div class="message">To the Best Dad Ever! 🎉</div>
                <div class="instruction">Click to Open Card</div>
            </div>
            
            <div class="card-face card-back">
                <h1 style="font-size: 2.5em;">For Dad 💙</h1>
                <div class="poem">
                    <div class="poem-line">Roses are red,</div>
                    <div class="poem-line">Violets are blue,</div>
                    <div class="poem-line">51 looks amazing,</div>
                    <div class="poem-line">Especially on you!</div>
                </div>
                <div class="message" style="margin-top: 30px;">
                    Wishing you the happiest birthday filled with love, laughter, and all your favorite things! You're not just a year older, you're a year more awesome! ❤️
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create falling confetti
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ffd93d', '#6bcf7f'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 100);
            }
        }

        createConfetti();
        setInterval(createConfetti, 5000);
    </script>
</body>
</html>
